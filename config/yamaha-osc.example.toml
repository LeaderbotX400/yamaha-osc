# yamaha-osc — OSC to Yamaha RCP bridge
#
# Copy this file, edit the console address, and you are done. Every other setting has a working
# default; the values shown below are those defaults unless noted.
#
# Full OSC address reference: docs/osc-reference.md
# QLab setup walkthrough:     docs/qlab-setup.md

# ---------------------------------------------------------------------------------------------
# The console
# ---------------------------------------------------------------------------------------------
[console]

# The console's address. The port is optional and defaults to 49280, the RCP port on every Yamaha
# console that speaks it. This is the setting you actually have to change.
address = "192.168.50.20:49280"

# Instead of a fixed address, scan a subnet for a console on port 49280 and identify it by asking
# for its product name. Slower to start (well under a second on a /24) and one more thing that can
# surprise you mid-show, so prefer a static address and a DHCP reservation.
#   discover = "192.168.50.0/24"

# Pin the console socket to one local interface, by its IP address.
#
# A MacBook Air has no built-in Ethernet, so the console link runs over a USB-C adapter. Without
# this setting the OS picks the route, and if the adapter is unplugged it will happily fall back to
# Wi-Fi — which usually means the venue's network is suddenly in your cue path. Setting this makes
# that failure loud instead of silent.
#   bind_address = "192.168.50.10"

# How long to wait for the console's TCP handshake.
connect_timeout_ms = 3000

# How long to wait for a reply before giving up on a command. Only affects commands that wait for
# one; cue-path writes are fire-and-forget and never block on this.
response_timeout_ms = 1000

# ---------------------------------------------------------------------------------------------
# Where QLab sends OSC
# ---------------------------------------------------------------------------------------------
[osc]

# Address:port the bridge listens on.
#
# Keep this on loopback when QLab runs on the same Mac: there is no handshake, nothing to drop the
# packets, and no switch in the path. Use 0.0.0.0:53100 only if OSC arrives from another machine.
listen = "127.0.0.1:53100"

# "udp" or "tcp". UDP is right for loopback. TCP (framed with double-END SLIP, RFC 1055, which is
# what QLab and OSC 1.1 use) is worth it only when the bridge is on a different machine from QLab
# and you want delivery guarantees for long fades.
transport = "udp"

# The OSC channel number that means the console's first channel.
#
# RCP is 0-based internally: the console's channel 1 is `InCh 0`. Operators, the console surface,
# and QLab cues all think 1-based, so this defaults to 1 and the conversion happens here. Set it to
# 0 only if you want your OSC addresses to match raw RCP indices.
channel_base = 1

# ---------------------------------------------------------------------------------------------
# Protecting the console
# ---------------------------------------------------------------------------------------------
[limits]

# Minimum spacing between commands sent to the console, in milliseconds.
#
# 5ms — about 200 commands/second — is the pacing the Bitfocus Companion module has used against
# these consoles for years. It is the one number here with real field mileage behind it. Raising it
# makes fades coarser; lowering it risks the console falling behind and queueing.
min_command_interval_ms = 5

# Step rate for bridge-driven fades (`/ch/N/fade`). 30 is smooth and well inside the console's
# budget for a handful of simultaneous fades.
fade_tick_hz = 30

# When several fader moves for the same channel are queued, send only the newest.
#
# This is what makes a fast QLab 1D Fade safe: offering more messages than the console can absorb
# degrades to a slightly coarser ramp instead of building an unbounded backlog. The final value of
# a fade is never dropped. Turn this off only when debugging.
coalesce = true

# How many actions to buffer from OSC before shedding the oldest coalescable ones.
queue_depth = 1024

# ---------------------------------------------------------------------------------------------
# Health reporting (optional)
# ---------------------------------------------------------------------------------------------
[health]

# Where to send /bridge/status and /bridge/error. Point it at QLab's OSC input (port 53000) to
# make console connection state visible in the workspace. Comment out to disable entirely.
#   destination = "127.0.0.1:53000"

# Repeat the current status every N seconds. 0 sends only when the state changes.
heartbeat_s = 0

# ---------------------------------------------------------------------------------------------
# Channel names
# ---------------------------------------------------------------------------------------------
# Names make cues self-documenting: `/ch/lead_vox/fader -6` beats `/ch/5/fader -6` when someone
# else has to read your cue list at 20:05.
#
# Values are 1-based, matching the console surface and `channel_base` above. A name can be a single
# channel, a list, or a range — a name covering several channels fans one OSC message out to all of
# them.
#
# Names are not tied to a strip type, so `band = "1-8"` works as `/ch/band/on 0` and as
# `/dca/band/on 0`. A name made only of digits is rejected, because it would be ambiguous with a
# plain channel number.
[names]
# lead_vox = 5
# spare_mic = 12
# band      = "1-8"
# spots     = [1, 4, 7]
# orch      = "9-16,20"
