[workspace]
resolver = "2"
members = ["crates/yamaha-rcp", "crates/rcp-mock", "crates/yamaha-osc"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/BrenekH/yamaha-rcp-rs"

[workspace.dependencies]
yamaha-rcp = { version = "0.1.0", path = "crates/yamaha-rcp" }
rcp-mock = { path = "crates/rcp-mock" }

anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
rosc = "0.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# The bridge sits in the cue path; favour a single well-optimised unit over build speed.
lto = "thin"
codegen-units = 1
