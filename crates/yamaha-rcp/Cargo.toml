[package]
name = "yamaha-rcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Remote control of Yamaha mixing consoles using TCP/IP networking."
documentation = "https://docs.rs/yamaha-rcp"
readme = "README.md"
keywords = ["networking", "audio", "mixing", "yamaha"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
rcp-mock = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
